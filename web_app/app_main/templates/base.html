<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Directory{% endblock title %}</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    {% block css %}
    <style>
      :root {
        --bg-main: #0b1d33;
        --bg-card: #102a45;
        --accent-color: #a8e6cf;
        --accent-hover: #8ed6bd;
        --text-main: #ffffff;
        --text-muted: #8fa0b5;
        --text-sub: #cbd5e1;
        --border-color: rgba(128, 5, 5, 0.08);
        --border-accent: rgba(168, 230, 207, 0.25);
        --font-stack: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background-color: var(--bg-main);
        font-family: var(--font-stack);
        font-size: 15px;
        line-height: 1.6;
        color: var(--text-main);
      }

      .dir-container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
      }

      .dir-topbar {
        margin-bottom: 24px;
        text-align: center;
      }

      .dir-title {
        font-size: 28px;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: 0.5px;
      }

      .dir-title span {
        color: var(--accent-color);
      }

      .dir-subtitle {
        font-size: 14px;
        color: var(--text-muted);
        margin-top: 4px;
      }

      .dir-controls-box {
        background-color: var(--bg-card);
        padding: 24px;
        border-radius: 8px;
        margin-bottom: 30px;
        border: 1px solid var(--border-color);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .dir-search-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .dir-search-input {
        width: 100%;
        background-color: var(--bg-main);
        border: 1px solid var(--border-accent);
        color: var(--text-main);
        padding: 12px 18px;
        border-radius: 6px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s ease;
      }

      .dir-search-input:focus {
        border-color: var(--accent-color);
      }

      .dir-filters-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) auto auto;
        gap: 12px;
        align-items: center;
      }

      .dir-select {
        background-color: var(--bg-main);
        border: 1px solid var(--border-accent);
        color: var(--text-main);
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
        cursor: pointer;
      }

      .dir-select option {
        background-color: var(--bg-card);
        color: var(--text-main);
      }

      .dir-btn-filter {
        background-color: var(--accent-color);
        color: var(--bg-main);
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .dir-btn-filter:hover {
        background-color: var(--accent-hover);
      }

      .dir-btn-reset {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 14px;
        padding: 10px 14px;
        text-align: center;
        transition: color 0.2s ease;
      }

      .dir-btn-reset:hover {
        color: var(--text-main);
      }

      .dir-skills-section {
        border-top: 1px solid var(--border-color);
        padding-top: 16px;
      }

      .dir-skills-header {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.2px;
        color: var(--accent-color);
        text-transform: uppercase;
        margin-bottom: 14px;
      }

      .dir-checkbox-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 14px 10px;
      }

      .dir-checkbox-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--text-sub);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        transition: color 0.2s ease;
      }

      .dir-checkbox-label:hover {
        color: var(--text-main);
      }

      .dir-checkbox {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border: 1.5px solid rgba(168, 230, 207, 0.4);
        border-radius: 50%;
        background-color: var(--bg-main);
        cursor: pointer;
        position: relative;
        outline: none;
        flex-shrink: 0;
        transition: all 0.2s ease;
      }

      .dir-checkbox:hover {
        border-color: var(--accent-color);
      }

      .dir-checkbox:checked {
        background-color: var(--accent-color);
        border-color: var(--accent-color);
      }

      .dir-checkbox:checked::after {
        content: "";
        position: absolute;
        left: 5px;
        top: 2px;
        width: 4px;
        height: 8px;
        border: solid var(--bg-main);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }

      .dir-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
        margin-bottom: 35px;
      }

      .dir-card {
        background-color: var(--bg-card);
        border-radius: 8px;
        padding: 24px;
        border: 1px solid var(--border-color);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease;
      }

      .dir-card:hover {
        transform: translateY(-4px);
        border-color: rgba(168, 230, 207, 0.35);
      }

      .dir-card-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }

      .dir-avatar-badge {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background-color: #183a5e;
        border: 2px solid var(--accent-color);
        color: var(--accent-color);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 18px;
        flex-shrink: 0;
        text-transform: uppercase;
      }

      .dir-card-name {
        font-size: 18px;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1.3;
      }

      .dir-card-role {
        font-size: 13px;
        color: var(--accent-color);
        margin-top: 2px;
      }

      .dir-card-meta {
        font-size: 13px;
        color: var(--text-sub);
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .dir-meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        word-break: break-all;
      }

      .dir-tags-box {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 20px;
        margin-top: auto;
      }

      .dir-tag {
        background-color: rgba(168, 230, 207, 0.12);
        color: var(--accent-color);
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
      }

      .dir-btn-view {
        display: block;
        text-align: center;
        background-color: transparent;
        color: var(--accent-color);
        border: 1px solid var(--accent-color);
        padding: 10px 16px;
        border-radius: 6px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .dir-btn-view:hover {
        background-color: var(--accent-color);
        color: var(--bg-main);
      }

      .dir-pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
      }

      .dir-page-link {
        min-width: 38px;
        height: 38px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-card);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .dir-page-link:hover {
        border-color: var(--accent-color);
        color: var(--accent-color);
      }

      .dir-page-link.active {
        background-color: var(--accent-color);
        color: var(--bg-main);
        border-color: var(--accent-color);
      }

      .dir-page-disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      @media (max-width: 992px) {
        .dir-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .dir-checkbox-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      @media (max-width: 650px) {
        .dir-grid {
          grid-template-columns: 1fr;
        }
        .dir-filters-row {
          grid-template-columns: 1fr;
        }
        .dir-checkbox-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .dir-resume-container {
        max-width: 900px;
      }

      .dir-resume-box {
        padding: 36px;
      }

      .dir-resume-header {
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 24px;
        margin-bottom: 24px;
      }

      .dir-avatar-large {
        width: 64px;
        height: 64px;
        font-size: 22px;
      }

      .dir-title-large {
        font-size: 32px;
        line-height: 1.2;
      }

      .dir-role-large {
        font-size: 15px;
        margin-top: 4px;
      }

      .dir-meta-large {
        margin-bottom: 16px;
        font-size: 14px;
      }

      .dir-meta-key {
        color: var(--accent-color);
        font-weight: 600;
      }

      .dir-meta-value {
        color: var(--text-main);
        text-decoration: none;
      }

      .dir-resume-desc {
        font-size: 14px;
        color: var(--text-sub);
        line-height: 1.6;
      }

      .dir-resume-sections {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .dir-section-no-border {
        border-top: none;
        padding-top: 0;
      }

      .dir-item-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main);
      }

      .dir-item-detail {
        font-size: 14px;
        color: var(--text-sub);
        margin-top: 2px;
      }

      .dir-skill-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px dashed var(--border-color);
        padding-bottom: 8px;
      }

      .dir-skill-row:last-child {
        border-bottom: none;
      }

      .dir-skill-name {
        font-size: 14px;
        color: var(--text-main);
        font-weight: 500;
      }

      .dir-rating-box {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .dir-text-center {
        text-align: center;
      }

      .dir-msg-empty {
        padding: 48px 20px;
        color: var(--text-muted);
        font-size: 18px;
      }

      .dir-page-info {
        margin-bottom: 12px;
        color: var(--text-muted);
        font-size: 14px;
      }

      .dir-inline-block {
        display: inline-block;
      }
    </style>
    {% endblock css %}
  </head>
  <body>
 HEAD
    {% block navbar %}
    {% include 'components/nav.html' %}
    {% endblock navbar %}
    {% block content %}

    {% block content %}{% endblock content %}
DEV
  </body>
</html>
